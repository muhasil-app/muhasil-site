<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Muhasil's icon: a white wallet on wine, gold cards slipping out of it, a gold clasp with «م».
       The letter is set in Cairo Bold; installer/windows/make-icon.mjs renders this file with the font
       loaded, so the pictures it writes do not depend on the fonts of the machine that shows them. -->
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9E2348"/><stop offset="1" stop-color="#5A0F2A"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#E0A21B"/></linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#wine)"/>
  <g transform="translate(-26 0) rotate(32 132 104)"><rect x="104" y="30" width="62" height="112" rx="10" fill="#E0A21B"/><rect x="112" y="30" width="10" height="112" fill="#5A0F2A" opacity=".55"/></g>
  <g transform="translate(-6 0) rotate(32 132 104)"><rect x="104" y="30" width="62" height="112" rx="10" fill="#F2C14E"/><rect x="112" y="30" width="10" height="112" fill="#5A0F2A" opacity=".55"/></g>
  <g transform="translate(16 0) rotate(32 132 104)"><rect x="104" y="30" width="62" height="112" rx="10" fill="url(#gold)"/><rect x="122" y="56" width="26" height="34" rx="6" fill="none" stroke="#5A0F2A" stroke-width="7"/></g>
  <rect x="46" y="100" width="164" height="112" rx="18" fill="#fff"/>
  <rect x="62" y="110" width="132" height="10" rx="5" fill="#5A0F2A" opacity=".25"/>
  <path d="M226 136 h-44 l-20 20 l20 20 h44 a8 8 0 0 0 8-8 v-24 a8 8 0 0 0-8-8z" fill="url(#gold)"/>
  <text x="206" y="170" text-anchor="middle" font-family="Cairo" font-weight="700" font-size="40" fill="#5A0F2A">م</text>
</svg>
